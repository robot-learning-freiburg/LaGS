# micromamba/conda environment providing the CUDA 11.8 toolchain used to build
# and run this project. It intentionally contains *only* the system-level CUDA
# toolkit and C/C++ compilers — all Python packages (PyTorch and everything
# else) are managed by uv from pyproject.toml.
#
# Usage:
#   micromamba create -f environment.yml
#   micromamba activate uv-cu118
#   uv sync                       # builds .venv with torch (cu118) + all deps
#
# nvcc and gcc/g++ from this env are put on PATH by `micromamba activate`, which
# is what torch's CUDAExtension build (mmcv, gsplat, tracker.ops.*) picks up.
name: uv-cu118
channels:
  - nvidia/label/cuda-11.8.0
  - conda-forge
dependencies:
  - python=3.11
  # full CUDA 11.8 metapackage: nvcc, headers, runtime, and the -dev libraries
  # the CUDA extensions link against
  - cuda=11.8.0
  # C/C++ compilers matched to CUDA 11.8 (nvcc 11.8 supports gcc <= 11)
  - gcc=11.4
  - gxx=11.4
  # ccache caches compiled objects so rebuilds of the CUDA extensions
  - ccache
  # uv is pinned here so a fresh machine only needs micromamba to bootstrap
  - uv
