# @package model

gaussian_temporal:
  confidence:
    enabled: true
    type: opacity
    alpha: 0.8
    decay_rate: 0.1
    dynamic_labels: ${data.labels.occupancy.movable}

    visibility:
      type: fov

  pruning:
  - type: range
    voxel_range: [-41.0, -41.0, -2.0, 41.0, 41.0, 6.4]

  - type: confidence
    threshold: 0.01
    opacity_threshold: 0.01

  - type: topk_hybrid
    hybrid_mode: max
    k:
      fine: ${eval:${model.num_gaussian_queries.fine} - ${model.gaussian_temporal.min_fresh.fine}}
