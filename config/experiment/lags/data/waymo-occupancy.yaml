# @package data
#
# Complete data pipeline for Waymo occupancy prediction
# Shared between f1 (single-frame detection) and f3 (multi-frame tracking)

defaults:
  - /data/labels/detection@labels.detection: waymo
  - /data/labels/occupancy@labels.occupancy: waymo

source:
  train:
    source:
      type: WaymoTO
      root: ${paths.datasets.waymo_trackocc}
      split: training

    transforms:
      - type: waymo.LoadMultiFrameData
        frames: ${common.num_frames}
        transforms:
          - type: Collection
            transforms: &loader_transforms
              - type: waymo.LoadTimestamp
              - type: waymo.LoadImages
                mode: bgr
                channels:
                  - CAM_FRONT
                  - CAM_FRONT_RIGHT
                  - CAM_FRONT_LEFT
                  - CAM_SIDE_LEFT
                  - CAM_SIDE_RIGHT
              - type: waymo.LoadLidar
              - type: PrepareLidarEgoToGlobalTxFused

          - type: Collection
            transforms:
              - type: waymo.LoadAnnotations
                labels: ${data.labels.detection}
                forecasting_steps: 12
              - type: FilterInstancesByRange
                range: [-51.2, -51.2, 51.2, 51.2]
                check: center
              - type: waymo.LoadSemanticOccupancy
                root: "${paths.datasets.waymo_trackocc_occ3d}"
                labels: ${data.labels.occupancy}
                apply_fov_mask: true
                valid_mask: [camera]
              - type: occupancy.ComputeDistanceField
                labels: ${data.labels.occupancy}
                mask: camera
                method: gradient
              - type: occupancy.ComputeSemanticMasks
              - type: occupancy.ComputeInstanceMasks
              - type: occupancy.DropLabelsWithoutOccupancy
                mask: camera
              - type: DropSamplesWithoutGtBoxes

      - type: CollectMultiFrameImages

      - type: Collection
        transforms:
          - type: augment.RandomScaleAndCropImages
            size: [256, 704]
            scale: [0.345, 0.41]
            h_offset: [1.0, 1.0]

          # Apply flip only for single-frame (f1)
          - type: Conditional
            condition: "${common.num_frames} == 1"
            transforms:
              - type: augment.RandomFlipImages
                probability: [0.0, 0.5]
              - type: augment.RandomRotateImages
                angle: [-5.4, 5.4]

      - type: Collection
        transforms: &normalization_transforms
          - type: NormalizeImages
            mean: [103.530, 116.280, 123.675]
            std: [57.375, 57.120, 58.395]
          - type: PadImages
            divisor: 32
            mode: constant
            value: 0

      - type: DepthFromLidarMultiFrame
        range: ${common.depth_range}

      - type: PrepareCameraToLidarEgoTxMultiFrameFused
      - type: PrepareLidarEgoToCameraTxMultiFrameFused

      - type: Drop
        keys:
          - labels.occupancy.instance_ids

    on_none: resample

  val:
    source:
      type: WaymoTOSequential
      root: "${paths.datasets.waymo_trackocc}"
      split: validation
      batch_size: ${data.loader.val.batch_size}
      batch_mode: parallel
      device_mode: parallel

    transforms:
      - type: Collection
        transforms: *loader_transforms

      - type: Collection
        transforms:
          - type: waymo.LoadSemanticOccupancy
            root: "${paths.datasets.waymo_trackocc_occ3d}"
            labels: ${data.labels.occupancy}
            valid_mask: [camera]

      - type: ScaleAndCropImages
        size: [256, 704]
        h_offset: 1.0

      - type: Collection
        transforms: *normalization_transforms

      - type: PrepareCameraToLidarEgoTxFused
      - type: PrepareLidarEgoToCameraTxFused

  predict:
    source:
      type: WaymoTOSequential
      root: "${paths.datasets.waymo_trackocc}"
      split: validation
      batch_size: ${data.loader.val.batch_size}
      batch_mode: parallel
      device_mode: parallel

    transforms:
      - type: Collection
        transforms: *loader_transforms

      - type: ScaleAndCropImages
        size: [256, 704]
        h_offset: 1.0

      - type: Collection
        transforms: *normalization_transforms

      - type: PrepareCameraToLidarEgoTxFused
      - type: PrepareLidarEgoToCameraTxFused
